<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#twitterGradient)"/>
  
  <!-- Decorative sparkles -->
  <text x="150" y="120" font-size="40" fill="#f8b4cb" opacity="0.6">✨</text>
  <text x="1050" y="180" font-size="30" fill="#e6ddd4" opacity="0.7">💫</text>
  <text x="200" y="500" font-size="35" fill="#f0c674" opacity="0.5">🌟</text>
  <text x="950" y="450" font-size="25" fill="#d69e2e" opacity="0.6">✨</text>
  
  <!-- Main content optimized for Twitter -->
  <text x="600" y="180" font-family="serif" font-size="56" font-weight="700" text-anchor="middle" fill="#2d3748">
    ✨ GlowUp Beauty
  </text>
  
  <text x="600" y="250" font-family="sans-serif" font-size="28" text-anchor="middle" fill="#4a5568">
    Skincare Tips &amp; Beauty Guides
  </text>
  
  <text x="600" y="320" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#718096">
    🧴 Expert product reviews
  </text>
  
  <text x="600" y="370" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#718096">
    🔬 Ingredient science explained
  </text>
  
  <text x="600" y="420" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#718096">
    💚 Gentle routines for all skin types
  </text>
  
  <text x="600" y="520" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#a0aec0">
    www.skincareinsights.info
  </text>
  
  <!-- Twitter-optimized gradient -->
  <defs>
    <linearGradient id="twitterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef7ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fff4;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>