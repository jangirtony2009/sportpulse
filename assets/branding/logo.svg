<svg width="500" height="200" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="200" fill="url(#logoGradient)" rx="20"/>
  
  <!-- Sparkle icon -->
  <text x="80" y="120" font-size="60" fill="#e91e63">✨</text>
  
  <!-- Brand text -->
  <text x="160" y="90" font-family="serif" font-size="36" font-weight="700" fill="#2d3748">
    GlowUp
  </text>
  <text x="160" y="130" font-family="serif" font-size="36" font-weight="700" fill="#2d3748">
    Beauty
  </text>
  
  <!-- Tagline -->
  <text x="160" y="155" font-family="sans-serif" font-size="14" fill="#718096">
    Radiant Skin • Beauty Tips • Wellness
  </text>
  
  <!-- Logo gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdf2f8;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>