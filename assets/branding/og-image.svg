<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="50" fill="#f8b4cb" opacity="0.3"/>
  <circle cx="1100" cy="530" r="80" fill="#e6ddd4" opacity="0.4"/>
  <circle cx="200" cy="500" r="30" fill="#f0c674" opacity="0.5"/>
  
  <!-- Main content -->
  <text x="600" y="200" font-family="serif" font-size="64" font-weight="700" text-anchor="middle" fill="#2d3748">
    ✨ GlowUp Beauty
  </text>
  
  <text x="600" y="280" font-family="sans-serif" font-size="32" text-anchor="middle" fill="#4a5568">
